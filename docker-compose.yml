# docker-compose.yml
version: '3.8'

services:
  # 1. The Message Broker
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"

  # 2. The Next.js Frontend
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api

  # 3. The FastAPI Server
  api:
    build: ./backend
    # Assuming your FastAPI code is in server.py. 
    # If it is in main.py, change 'server:app' to 'main:app'
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  # 4. The Background Workers
  worker:
    build: ./backend
    command: python run_worker.py
    env_file:
      - .env
    depends_on:
      - redis